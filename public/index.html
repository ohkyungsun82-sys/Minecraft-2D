<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Survival Web</title>
<link href="https://fonts.googleapis.com/css2?family=Galmuri9&display=swap" rel="stylesheet">
<style>
body{margin:0;overflow:hidden;font-family:'Galmuri9',sans-serif;background:#000;color:#fff;}
#ui{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#222;padding:30px;text-align:center;border:4px solid #555;}
input,button{font-family:'Galmuri9';margin:5px;padding:10px;font-size:16px;}
button{background:#5a5;color:#fff;border:2px solid #383;cursor:pointer;}
#game{display:none;position:absolute;top:0;left:0;width:100%;height:100%;}
canvas{display:block;}
#chatbox{position:absolute;bottom:80px;left:20px;width:350px;height:200px;background:rgba(0,0,0,0.6);display:flex;flex-direction:column;border:2px solid #444;}
#msgs{flex:1;overflow-y:auto;padding:10px;font-size:14px;text-shadow:1px 1px 0 #000;line-height:1.5;}
#chatinput{width:100%;box-sizing:border-box;background:rgba(0,0,0,0.8);color:#fff;border:none;padding:10px;outline:none;font-family:'Galmuri9';}
#tab{display:none;position:absolute;top:60px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);padding:20px;min-width:300px;text-align:center;border:2px solid #fff;}
#mc-ui{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:364px;pointer-events:none;}
#bars{display:flex;justify-content:space-between;width:100%;margin-bottom:2px;}
.bar{display:flex;}
.icon{width:18px;height:18px;background-size:cover;image-rendering:pixelated;}
#hotbar{position:relative;width:364px;height:44px;background:url('https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19.2/assets/minecraft/textures/gui/widgets.png') 0 0 / 512px 512px;image-rendering:pixelated;pointer-events:auto;}
#sel-box{position:absolute;top:-2px;width:48px;height:48px;background:url('https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19.2/assets/minecraft/textures/gui/widgets.png') 0 -44px / 512px 512px;image-rendering:pixelated;pointer-events:none;transition:left 0.1s;z-index:10;}
.slot{position:absolute;top:6px;width:32px;height:32px;cursor:pointer;image-rendering:pixelated;background-size:cover;}
.cnt{position:absolute;bottom:-4px;right:-2px;color:#fff;text-shadow:2px 2px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000;font-size:14px;font-family:'Galmuri9';pointer-events:none;}
#btn_out{position:absolute;top:20px;left:20px;padding:5px 10px;font-size:12px;background:#c22;border:2px solid #f55;color:#fff;pointer-events:auto;}
</style>
</head>
<body>
<div id="ui">
<h2>멀티 서바이벌</h2>
<input id="id" placeholder="닉네임"><br>
<input id="pw" type="password" placeholder="비밀번호"><br>
<button id="btn_log">로그인</button>
<button id="btn_reg">회원가입</button>
</div>
<div id="game">
<canvas id="cvs"></canvas>
<button id="btn_out">로그아웃</button>
<div id="chatbox">
<div id="msgs"></div>
<input id="chatinput" placeholder="채팅 입력 (Enter) | Tab: 인원">
</div>
<div id="mc-ui">
<div id="bars">
<div id="hearts" class="bar"></div>
<div id="food" class="bar"></div>
</div>
<div id="hotbar">
<div id="sel-box"></div>
</div>
</div>
<div id="tab">접속자 목록<hr><div id="plist"></div></div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="game.js"></script>
</body>
</html>
